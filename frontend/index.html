<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark"> <!-- Iniciando no modo escuro pela estética sci-fi -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech AI | Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones do Phosphor Icons para um visual moderno -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="login.js" defer></script>
</head>
<body>
    <button class="theme-toggle" id="btnTheme" title="Alternar Tema">
        <i class="ph ph-moon-stars"></i>
    </button>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <!-- Espaço provisório para a Lumina -->
                <div class="lumina-icon">
                    <i class="ph ph-owl"></i> 
                </div>
                <h1>BiblioTech <span>AI</span></h1>
                <p>O conhecimento do futuro, hoje.</p>
            </div>

            <form id="formLogin" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" id="email" placeholder="caike@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock-key"></i>
                        <input type="password" id="senha" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Acessar Sistema</button>
            </form>

            <div class="login-footer">
                <p>Ainda não é leitor? <a href="#">Cadastre-se</a></p>
            </div>
        </div>
    </main>

    <script>
        // Lógica simples para alternar entre Claro e Escuro
        const btnTheme = document.getElementById('btnTheme');
        const html = document.documentElement;
        const icon = btnTheme.querySelector('i');

        btnTheme.addEventListener('click', () => {
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                icon.classList.replace('ph-moon-stars', 'ph-sun');
            } else {
                html.setAttribute('data-theme', 'dark');
                icon.classList.replace('ph-sun', 'ph-moon-stars');
            }
        });
    </script>
</body>
</html>
