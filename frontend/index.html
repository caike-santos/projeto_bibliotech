<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark"> <!-- Iniciando no modo escuro pela estética sci-fi -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech AI | Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones do Phosphor Icons para um visual moderno -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="toast.js" defer></script>
    <script src="login.js" defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="shortcut icon" href="imagens/icon.png" type="image/x-icon">
</head>
<body>
    <canvas id="kinetic-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; pointer-events:none;"></canvas>
    <button class="theme-toggle" id="btnTheme" title="Alternar Tema">
        <i class="ph ph-moon-stars"></i>
    </button>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <!-- Espaço provisório para a Lumina -->
                <div class="lumina-icon">
                    <i class="ph ph-owl"></i> 
                </div>
                <h1>BiblioTech <span>AI</span></h1>
                <p>O conhecimento do futuro, hoje.</p>
            </div>

            <form id="formLogin" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" id="email" placeholder="caike@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock-key"></i>
                        <input type="password" id="senha" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Acessar Sistema</button>
                
                <div style="display: flex; align-items: center; margin: 1.5rem 0; gap: 0.5rem;">
                    <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                    <span style="color: var(--text-muted); font-size: 0.85rem;">OU</span>
                    <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                </div>

                <div id="g_id_onload"
                     data-client_id="931451427463-9ejo8fhqk52f1cd9n73otq7fse7ruimv.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left"
                     style="display: flex; justify-content: center; width: 100%;">
                </div>
            </form>

            <div class="login-footer">
                <p id="toggleText">Ainda não é leitor? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>

    <script>
        // Lógica para alternar e persistir o Tema
        const btnTheme = document.getElementById('btnTheme');
        const html = document.documentElement;
        const icon = btnTheme ? btnTheme.querySelector('i') : null;

        // Carrega o tema do localStorage ou usa 'dark' como padrão
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        if (icon) {
            if (savedTheme === 'light') {
                icon.classList.replace('ph-moon-stars', 'ph-sun');
            } else {
                icon.classList.replace('ph-sun', 'ph-moon-stars');
            }
        }

        if (btnTheme) {
            btnTheme.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                
                if (newTheme === 'light') {
                    icon.classList.replace('ph-moon-stars', 'ph-sun');
                } else {
                    icon.classList.replace('ph-sun', 'ph-moon-stars');
                }
            });
        }
    </script>
    <script src="kinetic-grid.js"></script>
</body>
</html>
