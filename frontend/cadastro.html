<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech AI | Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="toast.js" defer></script>
    <script src="cadastro.js" defer></script>
    <link rel="shortcut icon" href="imagens/icon.png" type="image/x-icon">
</head>
<body>
    <canvas id="kinetic-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; pointer-events:none;"></canvas>
    <button class="theme-toggle" id="btnTheme" title="Alternar Tema">
        <i class="ph ph-moon-stars"></i>
    </button>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <div class="lumina-icon">
                    <i class="ph ph-user-plus"></i> 
                </div>
                <h1>Crie sua <span>Conta</span></h1>
                <p>Junte-se ao futuro do conhecimento.</p>
            </div>

            <form id="formCadastro" class="login-form">
                <div class="input-group">
                    <label for="cadNome">Nome Completo</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="cadNome" placeholder="Seu nome" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="cadEmail">E-mail</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" id="cadEmail" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="cadSenha">Senha</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock-key"></i>
                        <input type="password" id="cadSenha" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Criar Conta</button>
            </form>

            <div class="login-footer">
                <p>Já possui conta? <a href="index.html">Entrar</a></p>
            </div>
        </div>
    </main>

    <script>
        // Lógica para alternar e persistir o Tema
        const btnTheme = document.getElementById('btnTheme');
        const html = document.documentElement;
        const icon = btnTheme ? btnTheme.querySelector('i') : null;

        // Carrega o tema do localStorage ou usa 'dark' como padrão
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        if (icon) {
            if (savedTheme === 'light') {
                icon.classList.replace('ph-moon-stars', 'ph-sun');
            } else {
                icon.classList.replace('ph-sun', 'ph-moon-stars');
            }
        }

        if (btnTheme) {
            btnTheme.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                
                if (newTheme === 'light') {
                    icon.classList.replace('ph-moon-stars', 'ph-sun');
                } else {
                    icon.classList.replace('ph-sun', 'ph-moon-stars');
                }
            });
        }
    </script>
    <script src="kinetic-grid.js"></script>
</body>
</html>
